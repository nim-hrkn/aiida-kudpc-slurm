[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-kudpc-slurm"
version = "1.2.0"
description = "Unofficial AiiDA scheduler plugin for Kyoto University ACCMS supercomputers (KUDPC: camphor / laurel / cinnamon), using KUDPC's --rsc resource syntax"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Hiori Kino", email = "hkino@ism.ac.jp"}]
keywords = ["aiida", "accms", "kudpc", "kyoto-university", "scheduler", "slurm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: AiiDA",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9,<3.14"
dependencies = ["aiida-core>=2.5,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Source = "https://github.com/nim-hrkn/aiida-kudpc-slurm"

[project.entry-points."aiida.schedulers"]
"kudpc_slurm.slurm" = "aiida_kudpc_slurm.slurm:KudpcSlurmScheduler"
# Former name (aiida-kudpc <= 1.1.0); computers set up with it keep working.
"kudpc.slurm" = "aiida_kudpc_slurm.slurm:KudpcSlurmScheduler"

[tool.setuptools.packages.find]
include = ["aiida_kudpc_slurm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
